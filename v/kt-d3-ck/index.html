<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Đang mở trang chứng khoán Kiến Tha</title>
<noscript><meta http-equiv="refresh" content="0;url=https://hieuthinhvuong.github.io/chung-khoan/"></noscript>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1b2d;color:#f3efe6;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
main{max-width:420px}
h1{font-size:20px;margin:0 0 12px}
a{color:#e8c46a}
small{display:block;margin-top:24px;color:#a9b3c2;font-size:13px}
</style>
</head>
<body>
<main>
<h1>Đang chuyển bạn sang trang chứng khoán của Kiến Tha</h1>
<p>Nếu trang không tự chuyển, <a id="nhom" href="https://hieuthinhvuong.github.io/chung-khoan/">bấm vào đây</a>.</p>
<small>Trang này chỉ cộng một lượt vào bộ đếm theo từng nơi đăng. Không lưu địa chỉ IP hay thông tin cá nhân.</small>
</main>
<script>
(function () {
  var MA = "kt-d3-ck";
  var DICH = "https://hieuthinhvuong.github.io/chung-khoan/";
  var DEM = "https://209-97-173-35.sslip.io/v/";
  var di = false;
  function sang() { if (di) return; di = true; location.replace(DICH); }
  setTimeout(sang, 1200);
  try {
    fetch(DEM + MA, {
      mode: "no-cors", cache: "no-store", keepalive: true,
      credentials: "omit", referrerPolicy: "no-referrer"
    }).then(sang, sang);
  } catch (e) { sang(); }
})();
</script>
</body>
</html>
