<body>
<noscript><p><a href="/v/bl-zalo-vang/">Bấm vào đây để tiếp tục</a></p></noscript>
<script>
(function () {
  var KHOA = "bl-zalo-vang-ab", pick = "";
  try { pick = localStorage.getItem(KHOA) || ""; } catch (e) {}
  if (pick !== "A" && pick !== "B") {
    pick = Math.random() < 0.5 ? "A" : "B";
    try { localStorage.setItem(KHOA, pick); } catch (e) {}
  }
  var q = "";
  try { q = location.search || ""; } catch (e) {}
  var dich = (pick === "B" ? "/v/bl-zalo-vang-b/" : "/v/bl-zalo-vang/") + q;
  location.replace(dich);
})();
</script>
</body>
